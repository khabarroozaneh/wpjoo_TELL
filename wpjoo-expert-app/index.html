<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#116466"><meta name="description" content="بارگذاری خروجی منشی و مدیریت آفلاین قرارهای کارشناس"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="stylesheet" href="styles.css"><title>وردپرس جو | پنل کارشناس</title></head><body><header><h1>وردپرس جو</h1><p>پنل کارشناس و مدیریت قرارها</p></header><main><section class="hero"><h2>پنل کارشناس</h2><p>فایل JSON خروجی منشی را بارگذاری کنید.</p></section><section id="alertBox" class="alert hidden"></section><div class="toolbar"><label class="file"><input id="jsonFile" type="file" accept=".json,application/json"><span>بارگذاری JSON منشی</span></label><button id="exportData">پشتیبان پنل کارشناس</button><button id="clearData" class="danger">پاک‌کردن اطلاعات</button></div><div class="stats"><div><b id="totalCount">۰</b><span>کل قرارها</span></div><div><b id="soonCount">۰</b><span>تا ۲۴ ساعت آینده</span></div><div><b id="overdueCount">۰</b><span>گذشته</span></div></div><div class="filters"><button class="filter active" data-filter="all">همه</button><button class="filter" data-filter="soon">۲۴ ساعت آینده</button><button class="filter" data-filter="overdue">گذشته</button></div><div id="result" class="result"></div><section id="appointments"></section></main><footer>آفلاین • داده‌ها روی همین دستگاه ذخیره می‌شوند</footer><script src="app.js"></script></body></html>
